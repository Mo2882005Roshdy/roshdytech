<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROSHDY TECH | لابتوبات - موبايلات - إكسسوارات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#080808;--card:#141414;--tx:#f5f1e6;--mu:#a39b86;--bd:#2a2418;--ac:#f5b301;--ac2:#ffd45e;--wa:#16a34a;--sh:0 8px 30px rgba(0,0,0,.55)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.logo{font-weight:800;font-size:22px;letter-spacing:1px;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite;text-decoration:none;direction:ltr}
nav{display:flex;gap:4px}
nav a{color:var(--tx);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:99px;transition:.25s}
nav a:hover{background:var(--card);color:var(--ac)}
.cartbtn,.tbtn{position:relative;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;transition:.25s}
.cartbtn:hover,.tbtn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.cartbtn.bump{animation:bump .5s}
.bdg{position:absolute;top:-6px;left:-6px;background:var(--ac);color:#141000;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.hero{position:relative;padding:48px 0 36px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 9s ease-in-out infinite}
.b1{width:320px;height:320px;background:var(--ac);top:-80px;right:-60px}
.b2{width:280px;height:280px;background:var(--ac2);bottom:-80px;left:-40px;animation-delay:-4s}
.hg{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.2;margin:0 0 12px;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);font-size:17px;margin:0 0 22px;max-width:520px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;text-decoration:none;color:#141000;background:linear-gradient(135deg,var(--ac),var(--ac2));transition:.25s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(245,179,1,.35)}
.btn.wa{background:var(--wa);color:#fff}
.btn.wa:hover{box-shadow:0 10px 24px rgba(22,163,74,.4)}
.btn.gh{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.pulse{animation:pulse 2.2s infinite}
.stats{display:flex;gap:22px;margin-top:26px}
.stats b{display:block;font-size:26px;font-weight:800;color:var(--ac)}
.stats small{color:var(--mu)}
.hart{animation:float 5s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(245,179,1,.28))}
section{padding:40px 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sh h2{margin:0;font-size:28px;font-weight:800}
.sh h2::after{content:"";display:block;height:4px;width:54px;border-radius:9px;margin-top:6px;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:grow 1s both}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;transition:.25s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#141000;border-color:transparent}
.inp{flex:1;min-width:160px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 14px;font:inherit;font-size:14px;outline:none;transition:.25s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh);transition:transform .3s,border-color .3s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-6px);border-color:var(--ac)}
.rv{opacity:0;transform:translateY(26px) scale(.97);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
.art{border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--bg)),var(--bg));display:grid;place-items:center;padding:8px;overflow:hidden}
.art svg{width:100%;height:auto;max-height:130px;transition:transform .4s}
.card:hover .art svg{transform:scale(1.08) rotate(-2deg)}
.card h3{margin:0;font-size:15px;font-weight:800;direction:ltr;text-align:right}
.sp{display:flex;flex-wrap:wrap;gap:5px}
.sp span{font-size:11.5px;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);border-radius:7px;padding:3px 8px;font-weight:600;direction:ltr}
.stk{font-size:12px;color:var(--mu)}
.stk.low{color:#f59e0b;font-weight:700}
.price{font-size:20px;font-weight:800;color:var(--ac)}
.ac{display:flex;gap:8px;margin-top:auto}
.ac .btn{flex:1;padding:9px 8px;font-size:13px}
.ico{font-size:46px;animation:float 4s ease-in-out infinite}
.more{display:block;margin:22px auto 0}
.mob{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;box-shadow:var(--sh);text-align:center}
.mob h3{margin:0 0 6px;font-size:22px}
.mob p{color:var(--mu);margin:0 0 16px}
.mob .chips{justify-content:center}
.mrow{display:flex;gap:8px;max-width:520px;margin:16px auto 0;flex-wrap:wrap}
.ph{font-size:64px;display:inline-block;animation:float 3.5s ease-in-out infinite}
footer{border-top:1px solid var(--bd);padding:28px 0 36px;margin-top:30px;text-align:center;color:var(--mu)}
footer a{color:var(--ac);font-weight:700;text-decoration:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;animation:fade .3s}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;animation:slide .35s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--bd);font-weight:800;font-size:18px}
.db{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;animation:fade .3s}
.it div:first-child{flex:1;min-width:0}
.it b{display:block;font-size:13px;direction:ltr;text-align:right}
.it small{color:var(--mu)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:800}
.df{padding:16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:50;animation:toast 2s both}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;font-size:28px;text-decoration:none;z-index:25;animation:pulse 2.2s infinite}
@keyframes flow{to{background-position:200% 0}}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes bump{40%{transform:scale(1.2)}}
@keyframes grow{from{width:0}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(-100%)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}70%{box-shadow:0 0 0 14px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@media (max-width:760px){.hg{grid-template-columns:1fr}nav{display:none}.hero{padding-top:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.logo{display:flex;align-items:center;gap:8px;text-decoration:none;direction:ltr;background:none;-webkit-background-clip:initial;color:inherit;animation:none}
.logo svg{width:42px;height:42px;flex:none}
.lt{line-height:1;text-align:left}.lt b{font-size:21px;font-weight:800;letter-spacing:.5px;color:var(--ac)}.lt b i{font-style:normal;color:#fff}.lt small{display:block;font-size:8.5px;letter-spacing:2.6px;color:var(--mu);margin-top:3px}
.hs{max-width:340px;border-radius:99px;padding:9px 16px}
.hero{background:radial-gradient(ellipse at 75% 40%,rgba(245,179,1,.16),transparent 60%),#0b0b0b;border-bottom:1px solid var(--bd)}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;border:1px solid var(--ac);color:var(--ac);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;margin-bottom:14px}
.tiles{background:#efefec;border-radius:22px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:-26px;position:relative;z-index:2;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.tile{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;color:#1a1a1a;font-weight:800;font-size:14px;text-decoration:none;transition:.3s;display:block}
.tile:hover{transform:translateY(-6px);box-shadow:0 10px 24px rgba(245,179,1,.35)}
.tile span{display:block;font-size:42px;margin-bottom:4px;animation:float 4s ease-in-out infinite}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:34px 0 6px}
.ft{display:flex;gap:12px;align-items:center}
.ft i{font-style:normal;flex:none;width:52px;height:52px;border:1.5px solid var(--ac);border-radius:14px;display:grid;place-items:center;font-size:24px;transition:.3s}
.ft:hover i{transform:rotate(-8deg) scale(1.1);background:rgba(245,179,1,.12)}
.ft b{display:block;font-size:15px}.ft small{color:var(--mu)}
.slog{font-size:22px;font-weight:800;color:var(--ac);margin:12px 0}
@media (max-width:760px){.hs{max-width:none;min-width:0;flex:1;padding:8px 12px;font-size:13px}.hd{gap:8px}.cartbtn{padding:8px 11px}.lt small{display:none}.lt b{font-size:16px;white-space:nowrap}.logo svg{width:34px;height:34px}.hero{padding-bottom:50px}.tiles{grid-template-columns:1fr 1fr}.tile:last-child{grid-column:1/-1}}
.mqs{padding:26px 0 6px;overflow:hidden}
.mqw{overflow:hidden;direction:ltr;margin:12px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.track{display:flex;width:max-content;animation:mq 40s linear infinite}
.track.rev{animation-direction:reverse}
.mqw:hover .track,.mqw:active .track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mi{width:190px;flex:none;margin-left:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;direction:rtl;text-decoration:none;color:var(--tx);transition:transform .3s,border-color .3s}
.mi:hover{border-color:var(--ac);transform:translateY(-5px)}
.mi .pic{height:112px;border-radius:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--bg)),var(--bg));display:grid;place-items:center;overflow:hidden}
.mi .pic svg{width:100%;max-height:100px}.mi img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:8px}
.mi b{font-size:12.5px;line-height:1.35;height:34px;overflow:hidden}
.mi em{font-style:normal;color:var(--ac);font-weight:800;font-size:13px}
@media (prefers-reduced-motion:reduce){.mqw{overflow-x:auto}.track{animation:none!important}}
.nf{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35}
.nfo{position:fixed;inset:0;z-index:-1}
.nfb{position:relative;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#141000;font-size:24px;font-weight:800;box-shadow:0 8px 24px rgba(245,179,1,.4);transition:transform .35s}
.nfb.o{transform:rotate(90deg)}
.nfm{position:absolute;bottom:66px;left:0;background:var(--card);border:1px solid var(--ac);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:180px;box-shadow:var(--sh);animation:pop .25s both}
.nfm a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--tx);text-decoration:none;font-weight:700;font-size:14px;animation:fin .35s both;transition:background .2s}
.nfm a:hover{background:rgba(245,179,1,.14);color:var(--ac)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.95)}}
@keyframes fin{from{opacity:0;transform:translateX(-14px)}}
.snd{position:fixed;left:19px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ac);background:var(--card);color:var(--ac);font-size:22px;box-shadow:var(--sh);transition:transform .3s}.snd:hover{transform:scale(1.1)}
.pimg{width:100%;height:170px;object-fit:contain;background:#fff;border-radius:10px;transition:transform .4s}.card:hover .pimg{transform:scale(1.06)}
.pimg{width:100%;height:170px;object-fit:contain;background:#fff;border-radius:10px;transition:transform .4s}.card:hover .pimg{transform:scale(1.06)}
</style>
</head>
